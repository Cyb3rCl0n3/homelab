# cloudflared isn't in the default Debian/Ubuntu repos, so it needs
# Cloudflare's own apt repo added first (same shape as the Docker repo setup
# in roles/docker/tasks/main.yml).

# The vztmpl base image is much more minimal than the cloud-image VMs —
# no gnupg, so apt_repository's signed-by handling has nothing to verify with.
- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Cloudflare GPG key
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /etc/apt/keyrings/cloudflare-main.gpg
    mode: "0644"

- name: Add cloudflared apt repository
  ansible.builtin.apt_repository:
    # "any" is literal here, not a distro codename — this repo isn't split per release.
    repo: "deb [signed-by=/etc/apt/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main"
    filename: cloudflared
    state: present

- name: Install cloudflared
  ansible.builtin.apt:
    name: cloudflared
    state: present
    update_cache: true

- name: Fail early if the tunnel token is not configured
  ansible.builtin.assert:
    that:
      - cloudflare_tunnel_token is defined and cloudflare_tunnel_token | length > 0
    fail_msg: >-
      cloudflare_tunnel_token is missing. Run `terraform output -raw
      cloudflare_tunnel_token` in proxmox/terraform and add it to
      inventory/group_vars/all/vault.yml (see vault.yml.example).

# service install embeds the token into the systemd unit; re-running it isn't
# harmful but isn't idempotent-clean either, so guard it like the Kasm role
# guards install.sh.
- name: Check whether the cloudflared service is already installed
  ansible.builtin.stat:
    path: /etc/systemd/system/cloudflared.service
  register: tunnel_service_unit

- name: Install cloudflared as a systemd service
  ansible.builtin.command:
    cmd: "cloudflared service install {{ cloudflare_tunnel_token }}"
  when: not tunnel_service_unit.stat.exists
  no_log: true
  changed_when: true

- name: Ensure cloudflared is enabled and running
  ansible.builtin.systemd_service:
    name: cloudflared
    enabled: true
    state: started
