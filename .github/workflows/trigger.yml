name: Infra pipeline
on:
  pull_request:
  push:
    branches: [main]
    paths: ["proxmox/terraform/**", "proxmox/ansible/**", ".github/workflows/**"]

# Least-privilege default for every job's GITHUB_TOKEN. Jobs that need more
# (e.g. terraform-scan writes PR checks) elevate explicitly in their own block.
permissions:
  contents: read

# Serialize whole-pipeline runs. The Terraform backend is a local file with no
# state locking, so only one run may touch state / the lab at a time.
# cancel-in-progress: false => a new run QUEUES behind the running one; we never
# kill a run mid-apply, which could corrupt state or leave half-created VMs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  terraform-scan:
    runs-on: [self-hosted, homelab]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    defaults:
      run:
        working-directory: proxmox/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      # - name: Tflint scan
      #   run: |
      #     docker run --rm \
      #       -v "$(pwd):/data" \
      #       -w /data \
      #       --user "$(id -u):$(id -g)" \
      #       -e TFLINT_PLUGIN_DIR=/data/.tflint.d \
      #       --entrypoint sh \
      #       ghcr.io/terraform-linters/tflint:latest \
      #       -c 'tflint --init && tflint --format junit > tflint_results_junit.xml'

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: proxmox/terraform
          trivy-config: proxmox/terraform/.trivy.yaml
          format: template
          template: '@${{ github.workspace }}/proxmox/terraform/.trivy-junit.tpl'
          output: proxmox/terraform/trivy_results_junit.xml

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12
        with:
          directory: proxmox/terraform
          config_file: proxmox/terraform/.checkov.yaml
          output_format: cli,junitxml
          output_file_path: console,proxmox/terraform/checkov_results_junit.xml

      - name: Publish scan results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: success() || failure()
        with:
          check_name: Terraform scan results
          files: proxmox/terraform/*_junit.xml
          action_fail: true

  terraform-plan:
    if: github.event_name == 'pull_request'
    needs: terraform-scan
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: proxmox/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: terraform init
      - run: terraform plan -no-color
        env:
          TF_VAR_PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
          TF_VAR_PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_PUBLIC_SSH_KEY: ${{ secrets.PUBLIC_SSH_KEY }}

  terraform-apply:
    if: github.event_name == 'push'
    needs: terraform-scan
    runs-on: [self-hosted, homelab]
    environment: production
    defaults:
      run:
        working-directory: proxmox/terraform
    outputs:
      inventory_ready: ${{ steps.gen_inventory.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: terraform init
      - run: terraform apply -auto-approve
        env:
          TF_VAR_PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
          TF_VAR_PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_PUBLIC_SSH_KEY: ${{ secrets.PUBLIC_SSH_KEY }}
      - id: gen_inventory
        run: terraform output -json > ../ansible/inventory/tf_output.json

  ansible-run:
    needs: terraform-apply
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: proxmox/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write SSH key
        run: |
          echo "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" | base64 -d > /tmp/homelab_ansible
          chmod 600 /tmp/homelab_ansible
      - name: Run ansible playbook
        env:
          SSH_PUBLIC_KEY: ${{ secrets.PUBLIC_SSH_KEY }}
          ADGUARD_ADMIN_PASSWORD: ${{ secrets.ADGUARD_ADMIN_PASSWORD }}
        run: |
          ansible-playbook \
           -i inventory/generated.ini \
           --private-key /tmp/homelab_ansible \
           -e "ssh_public_key=${SSH_PUBLIC_KEY}" \
           -e "adguard_admin_password=${ADGUARD_ADMIN_PASSWORD}" \
           playbooks/site.yml
      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/homelab_ansible