# Detection validation — prove the scan gate still FIRES on known-bad input.
#
# Why: a scanner that is disabled or misconfigured reports "0 findings" for
# insecure code exactly as it does for secure code. That is indistinguishable
# from not running at all, and a green check hides it. This happened here:
# `.checkov.yaml` limited `framework` to `terraform`, excluding the secrets
# framework, so a planted credential went undetected while the gate stayed green.
#
# The assertions are INVERTED: this job fails when a scanner STOPS detecting.
# It deliberately uses the same pinned actions and the same config files as the
# real pipeline, so it validates the configuration actually shipped — not tool
# defaults, and not a different locally-installed scanner version.
#
# Scanners run in soft-fail mode so a successful detection is a green step
# rather than a warning; the following step is what asserts and fails.
#
# Scope: a regression test for the gate, not a proof of coverage. It shows the
# scanners catch THESE patterns, not that they catch everything.
name: Detection validation

on:
  pull_request:
    paths:
      - "proxmox/terraform/.checkov.yaml"
      - "proxmox/terraform/.trivy.yaml"
      - "tests/**"
      - ".github/workflows/detection-validation.yml"
  # Weekly: detection can also break from an upstream scanner release, not just
  # from an edit to our own config.
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-validation:
    name: Scanners must detect known-bad input
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      matrix:
        python-version: [">=3.10"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: tests/requirements.txt
      - run: pip install -r tests/requirements.txt

      - name: Setup Fixtures
        run: python3 tests/fixtures/key_gen.py

      - name: Checkov against the canaries
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        continue-on-error: true
        with:
          directory: tests
          config_file: proxmox/terraform/.checkov.yaml
          soft_fail: true
          output_format: cli,json
          output_file_path: console,checkov_canary.json

      - name: Trivy against the canaries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: fs
          scan-ref: tests
          trivy-config: proxmox/terraform/.trivy.yaml
          exit-code: "0"
          format: json
          output: trivy_canary.json

      - name: Run detection tests
        env:
          CHECKOV_JSON: checkov_canary.json
          TRIVY_JSON: trivy_canary.json
        run: python3 -m pytest tests/test_detections.py -v --junit-xml=test-results.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        if: always()
        with:
          files: test-results.xml

      - name: Cleanup test artifacts
        if: always()
        run: rm -f checkov_canary.json trivy_canary.json test-results.xml
