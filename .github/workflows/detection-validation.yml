# Detection validation — prove the scan gate still FIRES on known-bad input.
#
# Why: a scanner that is disabled or misconfigured reports "0 findings" for
# insecure code exactly as it does for secure code. That is indistinguishable
# from not running at all, and a green check hides it. This happened here:
# `.checkov.yaml` limited `framework` to `terraform`, excluding the secrets
# framework, so a planted credential went undetected while the gate stayed green.
#
# The assertions are INVERTED: this job fails when a scanner STOPS detecting.
# It deliberately uses the same pinned actions and the same config files as the
# real pipeline, so it validates the configuration actually shipped — not tool
# defaults, and not a different locally-installed scanner version.
#
# Scanners run in soft-fail mode so a successful detection is a green step
# rather than a warning; the following step is what asserts and fails.
#
# Scope: a regression test for the gate, not a proof of coverage. It shows the
# scanners catch THESE patterns, not that they catch everything.
name: Detection validation

on:
  pull_request:
    paths:
      - "proxmox/terraform/.checkov.yaml"
      - "proxmox/terraform/.trivy.yaml"
      - "tests/**"
      - ".github/workflows/detection-validation.yml"
  # Weekly: detection can also break from an upstream scanner release, not just
  # from an edit to our own config.
  schedule:
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detection-validation:
    name: Scanners must detect known-bad input
    runs-on: [self-hosted, homelab]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Written at runtime, never committed: keeps a key-shaped blob out of git
      # history and clear of GitHub push protection.
      - name: Plant private-key canary
        run: |
          printf '%s\n' \
            '-----BEGIN OPENSSH PRIVATE KEY-----' \
            'b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW' \
            'QyNTUxOQAAACDaAKEaAKEaAKEaAKEaAKEaAKEaAKEaAKEaAKEaAKEaAKEaAA' \
            '-----END OPENSSH PRIVATE KEY-----' > tests/canary_private_key

      - name: Checkov against the canaries
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          directory: tests
          config_file: proxmox/terraform/.checkov.yaml
          soft_fail: true
          output_format: cli,json
          output_file_path: console,checkov_canary.json

      - name: Assert Checkov detected the planted credential
        run: |
          if ! python3 -c "import json,sys;d=json.load(open('checkov_canary.json'));b=d if isinstance(d,list) else [d];sys.exit(0 if sum(x.get('summary',{}).get('failed',0) for x in b) else 1)"; then
            echo "::error::Checkov found nothing in tests/ - is 'secrets' still in the framework list in .checkov.yaml?"
            exit 1
          fi
          echo "OK - Checkov detected the planted credential."

      - name: Trivy against the canaries
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: tests
          trivy-config: proxmox/terraform/.trivy.yaml
          exit-code: "0" # override .trivy.yaml's exit-code: 1 so the step stays green
          format: json
          output: trivy_canary.json

      - name: Assert Trivy detected the private key
        run: |
          if ! python3 -c "import json,sys;d=json.load(open('trivy_canary.json'));sys.exit(0 if any(r.get('Secrets') for r in (d.get('Results') or [])) else 1)"; then
            echo "::error::Trivy found no secret in tests/ - is the 'secret' scanner still enabled in .trivy.yaml?"
            exit 1
          fi
          echo "OK - Trivy detected the private key."

      - name: Remove canary and scan artifacts
        if: always()
        run: rm -f tests/canary_private_key checkov_canary.json trivy_canary.json
