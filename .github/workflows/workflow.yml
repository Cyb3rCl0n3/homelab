# Lints and security-audits the workflow files themselves.
#
# Rationale: nothing else in this repo checks trigger.yml. Trivy and Checkov
# scan Terraform, not GitHub Actions — so a malformed or insecure workflow
# (a broken `if:` guard, a secret interpolated into a `run:` block, an action
# drifting off its SHA pin) would ship unnoticed. This job is what protects the
# CI hardening from silently regressing.
#
# Runs on GitHub-hosted ubuntu-latest, not the self-hosted homelab runner:
# it needs no lab access, and hosted minutes are free for a public repo.
name: Workflow lint

on:
  pull_request:
  push:
    branches: [main]
    paths: [".github/workflows/**"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and audit workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # zizmor uploads its SARIF to Code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint: correctness — YAML schema, shell syntax in `run:` blocks
      # (via shellcheck), bad expressions, unknown `runs-on` labels.
      - name: actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          fail-on-error: true

      # zizmor: security — the anti-patterns actionlint doesn't cover, e.g.
      # template injection, credential persistence, excessive permissions,
      # unpinned actions. `version` is pinned deliberately: the action defaults
      # to "latest", which is the same mutable-reference problem we pin SHAs to
      # avoid. Findings upload to Security > Code scanning.
      - name: zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          version: "1.28.0"
          advanced-security: true
