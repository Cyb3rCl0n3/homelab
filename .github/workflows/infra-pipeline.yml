name: Infra pipeline
on:
  pull_request:
  push:
    branches: [main]
    paths: ["proxmox/terraform/**", "proxmox/ansible/**", ".github/workflows/**"]

# Least-privilege default for every job's GITHUB_TOKEN.
permissions:
  contents: read

# Serialize whole-pipeline runs. The Terraform backend is a local file with no
# state locking, so only one run may touch state / the lab at a time.
# cancel-in-progress: false => a new run QUEUES behind the running one; we never
# kill a run mid-apply, which could corrupt state or leave half-created VMs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  terraform-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to Security > Code scanning
    defaults:
      run:
        working-directory: proxmox/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; the workspace outlives
          # the job on a persistent self-hosted runner. No job here uses git.
          persist-credentials: false

      - name: Install Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform validate
        run: terraform validate

      # tflint complements Trivy/Checkov rather than overlapping them: those scan
      # for security misconfiguration, tflint catches Terraform correctness and
      # hygiene (untyped variables, missing version constraints) that the security
      # scanners have no rules for at all.
      - name: Tflint Install 
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0

      # Runs from the repo ROOT with --chdir, deliberately overriding this job's
      # working-directory default. tflint writes SARIF paths relative to its own
      # working directory, but code-scanning resolves them against the repo root.
      # From proxmox/terraform you get "inventory.tf", so every alert links to a
      # file that doesn't exist there. From the root you get the real path.
      - name: Tflint scan
        id: tflint
        continue-on-error: true
        working-directory: .
        run: tflint --recursive --chdir=proxmox/terraform --format sarif > tflint.sarif

      - name: Upload tflint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: tflint.sarif
          category: tflint


      # Both scanners run with continue-on-error so that a finding (exit-code 1)
      # doesn't skip the SARIF uploads below — findings are exactly when the
      # report matters. The explicit gate step at the end re-imposes the failure.
      - name: Trivy scan
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: proxmox/terraform
          trivy-config: proxmox/terraform/.trivy.yaml
          format: sarif
          output: trivy-terraform.sarif

      # A distinct `category` per tool is required: without it the second upload
      # overwrites the first tool's results for this commit. Note fork PRs don't
      # receive security-events: write, so this step would fail there — external
      # fork PRs already require manual approval before any workflow runs.
      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: trivy-terraform.sarif
          category: trivy-terraform

      - name: Checkov scan
        id: checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          directory: proxmox/terraform
          config_file: proxmox/terraform/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov-terraform.sarif

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: checkov-terraform.sarif
          category: checkov-terraform

      # Re-impose the gate the scanners' own exit codes would have applied,
      # now that both reports have been uploaded.
      - name: Gate on scan findings
        if: steps.trivy.outcome == 'failure' || steps.checkov.outcome == 'failure'
        run: |
          echo "::error::Security findings detected - see Security > Code scanning"
          exit 1
    
  ansible-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to Security > Code scanning
    defaults:
      run:
        working-directory: proxmox/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; the workspace outlives
          # the job on a persistent self-hosted runner. No job here uses git.
          persist-credentials: false
      - name: Ansible-lint scan
        id: ansible-lint
        continue-on-error: true
        uses: ansible/ansible-lint@262624cd0ab22a4221293216856c59671ce7aa5e # v26.6.0
        with:
          working_directory: proxmox/ansible
          args: >-
            . -c proxmox/ansible/.ansible-lint --nocolor
            --sarif-file proxmox/ansible/ansible-lint.sarif

      - name: Upload ansible-lint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: ansible-lint.sarif
          category: ansible-lint

      - name: Checkov scan
        id: checkov
        continue-on-error: true
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.3114.0
        with:
          directory: proxmox/ansible
          config_file: proxmox/ansible/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov-ansible.sarif
      
      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: checkov-ansible.sarif
          category: checkov-ansible

      - name: Gate on scan findings    
        if: steps.ansible-lint.outcome == 'failure' || steps.checkov.outcome == 'failure'
        run: |
          echo "::error::Security findings detected - see Security > Code scanning"
          exit 1

  terraform-plan:
    # Never let a Dependabot PR reach the self-hosted runner.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    needs: [terraform-scan, ansible-scan]
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: proxmox/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; the workspace outlives
          # the job on a persistent self-hosted runner. No job here uses git.
          persist-credentials: false
      - run: terraform init
      - run: terraform plan -no-color
        env:
          TF_VAR_PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
          TF_VAR_PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_PUBLIC_SSH_KEY: ${{ secrets.PUBLIC_SSH_KEY }}

  terraform-apply:
    # Defense-in-depth: apply only ever runs on a push to main, even if the
    # push trigger's branch filter is ever widened.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [terraform-scan, ansible-scan]
    runs-on: [self-hosted, homelab]
    environment: production
    # Proxmox creds are needed by both plan and apply, so set them once here.
    env:
      TF_VAR_PROXMOX_ENDPOINT: ${{ secrets.PROXMOX_ENDPOINT }}
      TF_VAR_PROXMOX_API_TOKEN: ${{ secrets.PROXMOX_API_TOKEN }}
      TF_VAR_PUBLIC_SSH_KEY: ${{ secrets.PUBLIC_SSH_KEY }}
    defaults:
      run:
        working-directory: proxmox/terraform
    outputs:
      inventory_ready: ${{ steps.gen_inventory.outcome }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; the workspace outlives
          # the job on a persistent self-hosted runner. No job here uses git.
          persist-credentials: false
      - run: terraform init
      # Save the plan, then apply exactly that plan file — apply executes
      # precisely what was planned, with no implicit re-plan that could differ
      # if state or the real infrastructure drifted between the two.
      - name: Terraform plan
        run: terraform plan -out=tfplan -input=false
      - name: Terraform apply
        run: terraform apply -input=false tfplan
      - id: gen_inventory
        run: terraform output -json > ../ansible/inventory/tf_output.json

  ansible-run:
    needs: terraform-apply
    runs-on: [self-hosted, homelab]
    defaults:
      run:
        working-directory: proxmox/ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the GITHUB_TOKEN in .git/config; the workspace outlives
          # the job on a persistent self-hosted runner. No job here uses git.
          persist-credentials: false
      - name: Write SSH key
        # Pass the secret via env, not inline ${{ }} in the script, so its value
        # is never interpolated into the shell command text.
        env:
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
        run: |
          echo "$ANSIBLE_SSH_PRIVATE_KEY" | base64 -d > /tmp/homelab_ansible
          chmod 600 /tmp/homelab_ansible
      - name: Run ansible playbook
        env:
          SSH_PUBLIC_KEY: ${{ secrets.PUBLIC_SSH_KEY }}
          ADGUARD_ADMIN_PASSWORD: ${{ secrets.ADGUARD_ADMIN_PASSWORD }}
        run: |
          ansible-playbook \
           -i inventory/generated.ini \
           --private-key /tmp/homelab_ansible \
           -e "ssh_public_key=${SSH_PUBLIC_KEY}" \
           -e "adguard_admin_password=${ADGUARD_ADMIN_PASSWORD}" \
           playbooks/site.yml
      - name: Cleanup SSH key
        if: always()
        run: rm -f /tmp/homelab_ansible